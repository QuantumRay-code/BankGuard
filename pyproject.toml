[project]
name = "bankguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.32.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psycopg[binary,pool]>=3.3.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-html>=4.2.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--html=reports/report.html --self-contained-html"
markers = [
    "smoke: fast checks that run on every push/PR",
    "regression: deeper checks including referential integrity, audit validation, and concurrency",
    "performance: query plan validation against the large dataset profile",
]

[tool.coverage.run]
source = ["main", "database", "ledger", "exceptions", "schemas"]
omit = ["tests/*", "scripts/*"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
