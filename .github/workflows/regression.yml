name: Regression Tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bankguard_user
          POSTGRES_PASSWORD: bankguard_pass
          POSTGRES_DB: bankguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bankguard_user:bankguard_pass@localhost:5432/bankguard_db

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run python scripts/run_migrations.py

      - name: Seed medium dataset
        run: uv run python scripts/seed_data.py --profile medium

      - name: Run regression tests
        run: uv run pytest -m "smoke or regression" -n auto --dist loadfile --cov --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
