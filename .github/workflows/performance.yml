name: Performance Tests

on:
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bankguard_user
          POSTGRES_PASSWORD: bankguard_pass
          POSTGRES_DB: bankguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bankguard_user:bankguard_pass@localhost:5432/bankguard_db

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run python scripts/run_migrations.py

      - name: Seed large dataset
        run: uv run python scripts/seed_data.py --profile large

      - name: Run performance tests
        run: uv run pytest -m performance -v

      - name: Generate performance report
        run: uv run python scripts/performance_report.py

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: reports/performance_report.md
